name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install system dependencies for buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            ccache patch

      - name: Set up swap (build memory headroom)
        run: |
          sudo fallocate -l 4G /swapfile || true
          sudo chmod 600 /swapfile || true
          sudo mkswap /swapfile || true
          sudo swapon /swapfile || true
          free -h

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.33" "virtualenv<20.26"

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK (debug)
        run: |
          yes | buildozer android debug

      - name: Locate built APK
        id: locate
        if: always()
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            echo "apk=$APK" >> "$GITHUB_OUTPUT"
            echo "Built: $APK"
          else
            echo "No APK produced — build likely failed"
            echo "apk=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-*/dists/*/build*.log
            .buildozer/**/*.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: outlinevpn-apk
          path: ${{ steps.locate.outputs.apk }}
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.apk }}
